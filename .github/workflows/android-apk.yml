name: android apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'website/index.html', 'website/css/**', 'website/js/**', 'website/images/**', 'website/model/**', '.github/workflows/android-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run sync
        working-directory: android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DumpGuard.apk
          gh release view --json body -q .body > notes.md 2>/dev/null || true
          [ -s notes.md ] || echo "Android install file. Download DumpGuard.apk on your phone and open it." > notes.md
          gh release create "v1.1.${{ github.run_number }}" DumpGuard.apk --target "$GITHUB_SHA" --title "DumpGuard for Android" --notes-file notes.md --latest
