name: android apk
on:
  workflow_dispatch:
  push:
    branches: [add-mobile-apps]
    paths: ['android-app/**', '.github/workflows/android-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew && ./gradlew assembleDebug
        working-directory: android-app/android
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk DumpGuard.apk
          gh release delete v1.0.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.0.0 DumpGuard.apk --target "$GITHUB_SHA" --title "DumpGuard for Android" --notes "Android install file. Download DumpGuard.apk on your phone and open it. Android will ask you to allow installs from your browser or files app."
